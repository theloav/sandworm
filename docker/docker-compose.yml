# Development-only simulated network. This is not a malware sandbox and has no
# sample runner. Live execution must go through a separately managed backend.

services:
  simnet:
    # Simulated-network responder (INetSim/FakeNet-style). Answers DNS/HTTP/etc.
    image: inetsim/inetsim:latest
    networks:
      detonation:
        ipv4_address: 10.0.0.1
    restart: "no"

networks:
  detonation:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.0.0/24
