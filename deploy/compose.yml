services:
  api:
    build: ..
    command: [serve, --host, 0.0.0.0]
    environment:
      SANDWORM_SAMPLE_PASSWORD: ${SANDWORM_SAMPLE_PASSWORD:?Set a strong archive password}
    volumes: [sandworm-data:/data]
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  worker:
    build: ..
    command: [worker]
    environment:
      SANDWORM_SAMPLE_PASSWORD: ${SANDWORM_SAMPLE_PASSWORD:?Set a strong archive password}
    volumes: [sandworm-data:/data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  proxy:
    image: caddy:2
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  sandworm-data:
  caddy-data:
  caddy-config:
