[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandworm"
version = "0.2.0"
description = "SANDWORM — isolated, multi-format malware reverse-engineering platform. Reconstruct what happened, explain why, emit detections."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SANDWORM" }]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Heavy / environment-specific backends are optional. The pipeline degrades
# gracefully when they are absent so the synthetic demos and CI run offline.
static = ["lief>=0.14", "pefile>=2023.2.7", "pyelftools>=0.30", "capstone>=5.0", "oletools>=0.60"]
# numpy accelerates the entropy hot path (whole file + every 4KB block + every
# section) ~20x on multi-MB samples; the pipeline falls back to pure Python when
# it is absent.
perf = ["numpy>=1.24"]
# AES-256 encryption-at-rest for the sample store, and emulation-assisted
# unpacking of packed binaries. Storage fails closed without the secure extra.
secure = ["pyzipper>=0.3.6"]
emulate = ["unicorn>=2.0", "capstone>=5.0", "pefile>=2023.2.7"]
graph = ["neo4j>=5.14"]
dynamic = []
memory = ["volatility3>=2.5"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "pyzipper>=0.3.6"]
ml = ["scikit-learn>=1.4"]
full = ["sandworm[static,perf,secure,emulate,graph,memory,web,llm,ml]==0.2.0"]
llm = ["anthropic>=0.25", "openai>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9", "numpy>=1.24", "capstone>=5.0"]

[project.urls]
Repository = "https://github.com/theloav/sandworm"
Issues = "https://github.com/theloav/sandworm/issues"

[project.scripts]
sandworm = "sandworm.cli:app"

[tool.setuptools.packages.find]
include = ["sandworm*"]

[tool.setuptools.package-data]
"sandworm.platform" = ["static/*.html", "static/*.js", "static/*.css"]
"sandworm.analyzers.static" = ["scripts/*.java"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer uses function calls in defaults by design

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true

# numpy is an optional accelerator imported behind try/except; its published
# stubs use 3.12-only `type` statements that a 3.11 target can't parse. Skip
# following them — our code treats numpy as an untyped optional dependency.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = "sklearn.*"
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
