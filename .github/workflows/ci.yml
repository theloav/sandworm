name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    # Fully offline: no secrets, no network-dependent backends. The optional
    # heavy backends (lief, neo4j, volatility3, capa, oletools) are intentionally
    # NOT installed. Capstone is included as a bounded static-analysis test
    # dependency; the runtime still degrades safely when it is absent.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (core + dev only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check sandworm tests plugins_example

      - name: Mypy
        run: mypy sandworm

      - name: Pytest (offline)
        env:
          SANDWORM_ALLOW_DETONATION: "false"
        run: pytest -q

      - name: Smoke — synthetic webshell end-to-end
        run: |
          sandworm analyze samples/synthetic/benign_webshell.php --out /tmp/report.html
          test -s /tmp/report.html
          sandworm plugins --dir plugins_example | grep plugin.wallet

  measurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,evaluation,matching,detections]'
      - name: Metric and adversarial-boundary regression tests
        run: pytest tests/test_evaluation.py tests/test_copilot_trust_boundary.py tests/test_detection_bundle_and_index.py
      - name: Fixed-corpus ATT&CK and calibration regression gate
        run: sandworm benchmark benchmarks/manifest.json --out /tmp/benchmark --baseline benchmarks/results/metrics.json
      - name: Convert and test detection bundles
        run: |
          sandworm detection-bundle benchmarks/fixtures/download.ps1 /tmp/detections-splunk --sigma-target splunk --sigma-pipeline splunk_windows --sigma-product windows
          sandworm detection-bundle benchmarks/fixtures/download.ps1 /tmp/detections-kql --sigma-target kusto --sigma-pipeline sentinel_asim --sigma-product windows
          pytest /tmp/detections-splunk/test_yara.py
      - name: Publish benchmark summary
        if: always()
        run: test ! -f /tmp/benchmark/summary.md || cat /tmp/benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-and-detection-bundles
          path: |
            /tmp/benchmark/
            /tmp/detections-splunk/
            /tmp/detections-kql/

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install platform and browser test dependencies
        run: |
          pip install -e '.[dev,web,ml,secure,emulate]' playwright
          playwright install --with-deps chromium
      - name: Test API, workers and browser workflows
        env:
          SANDWORM_BROWSER_TESTS: "1"
        run: pytest
      - name: Build container and verify non-root writable storage
        run: |
          docker build -t sandworm-ci .
          docker run --rm --entrypoint python sandworm-ci -c "import os,pathlib; assert os.getuid() == 10001; pathlib.Path('/data/probe').write_text('ok')"

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel with encryption and emulation support
        run: |
          python -m venv /tmp/sandworm-installed
          /tmp/sandworm-installed/bin/pip install dist/*.whl
          /tmp/sandworm-installed/bin/pip install pyzipper unicorn capstone
      - name: Smoke installed package outside checkout
        working-directory: /tmp
        env:
          SANDWORM_WORK_DIR: /tmp/sandworm-smoke
        run: |
          /tmp/sandworm-installed/bin/sandworm analyze "$GITHUB_WORKSPACE/samples/synthetic/benign_webshell.php" --store --out /tmp/report.html --json /tmp/findings.json
          test -s /tmp/report.html
          test -s /tmp/findings.json
          /tmp/sandworm-installed/bin/sandworm analyze "$GITHUB_WORKSPACE/samples/synthetic/loader_demo.exe" --cape-report "$GITHUB_WORKSPACE/samples/synthetic/recorded_cape_report.json" --memory-report "$GITHUB_WORKSPACE/samples/synthetic/recorded_vol3_report.json"
          /tmp/sandworm-installed/bin/sandworm ask "what execution sinks were found?"
      - uses: actions/upload-artifact@v4
        with:
          name: sandworm-distributions
          path: dist/*
